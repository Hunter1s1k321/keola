<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Keola — story banner 1080x1920</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Great+Vibes&family=Jost:wght@500&display=block" rel="stylesheet">
<link rel="stylesheet" href="../../keolahtml/css/tokens.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    position: relative; font-family: var(--font-display); color: var(--color-text); text-align: center;
    background:
      radial-gradient(90% 45% at 50% 105%, color-mix(in srgb, var(--color-candle-deep) 65%, transparent), transparent 70%),
      linear-gradient(180deg, var(--color-bg) 0%, var(--color-surface) 28%, var(--color-dusk) 58%, var(--color-rose-deep) 88%, var(--color-ember) 100%);
  }
  .stars {
    position: absolute; inset: 0; opacity: .85;
    background-image:
      radial-gradient(2px 2px at 10% 8%, var(--color-text) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 28% 18%, var(--color-text) 50%, transparent 51%),
      radial-gradient(2.4px 2.4px at 80% 6%, var(--color-candle-soft) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 90% 24%, var(--color-text) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 6% 40%, var(--color-text) 50%, transparent 51%),
      radial-gradient(2px 2px at 94% 52%, var(--color-candle-soft) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 16% 62%, var(--color-text) 50%, transparent 51%);
  }
  .glow {
    position: absolute; left: 50%; top: 260px; width: 1000px; height: 1000px; translate: -50% 0; border-radius: 50%;
    background: radial-gradient(circle, color-mix(in srgb, var(--color-candle) 34%, transparent) 0%, color-mix(in srgb, var(--color-rose) 14%, transparent) 40%, transparent 66%);
  }
  .chip { position: absolute; top: 230px; left: 0; right: 0; font-family: var(--font-label); font-size: 26px; letter-spacing: .4em; text-transform: uppercase; color: var(--color-candle); }
  .arch {
    position: absolute; left: 50%; top: 340px; width: 600px; height: 830px; translate: -50% 0;
    border-radius: 999px 999px 36px 36px; overflow: hidden;
    box-shadow: 0 60px 140px -30px color-mix(in srgb, var(--color-ember) 60%, transparent), 0 0 0 2px color-mix(in srgb, var(--color-rose-soft) 22%, transparent);
  }
  .arch img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; filter: saturate(.9) sepia(.08); }
  .arch::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 55%, color-mix(in srgb, var(--color-bg) 70%, transparent)); }
  .name { position: absolute; left: 0; right: 0; top: 1030px; font-family: var(--font-script); font-size: 300px; line-height: 1; text-shadow: 0 0 70px color-mix(in srgb, var(--color-rose) 60%, transparent); }
  .eyebrow { position: absolute; left: 0; right: 0; top: 1370px; font-style: italic; font-size: 52px; color: var(--color-text); }
  .sub { position: absolute; left: 0; right: 0; top: 1450px; font-style: italic; font-size: 40px; color: var(--color-rose-soft); }
  .url { position: absolute; left: 0; right: 0; bottom: 210px; font-family: var(--font-label); font-size: 28px; letter-spacing: .26em; color: var(--color-text); }
  .url::before { content: ""; display: block; width: 2px; height: 90px; margin: 0 auto 28px; background: linear-gradient(180deg, transparent, var(--color-candle)); }
</style>
</head>
<body>
  <div class="stars"></div>
  <div class="glow"></div>
  <p class="chip">Senja ke Fajar</p>
  <div class="arch"><img src="../../keolahtml/assets/img/keola-05.webp" alt=""></div>
  <p class="name">Keola</p>
  <p class="eyebrow">This is for my one and only.</p>
  <p class="sub">sebuah surat kecil, ditulis pelan-pelan</p>
  <p class="url">keola.netlify.app</p>
</body>
</html>
